name: API CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Jobs can read repository contents but cannot modify them.
permissions:
  contents: read

# Avoid overlapping releases from this workflow.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AutomationExecution.API.sln

      - name: Build solution
        run: dotnet build AutomationExecution.API.sln --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test AutomationExecution.API.sln --configuration Release --no-build

  deploy:
    # Deployment cannot start unless the tests pass.
    needs: build-and-test

    # Deploy only master, never pull-request code.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Allow GitHub to request a temporary identity token for Azure.
      id-token: write

    env:
      RESOURCE_GROUP: rg-automation-execution-dev
      CONTAINER_APP: ca-automation-execution-dev
      ACR_NAME: abdiautomationregistry
      ACR_SERVER: abdiautomationregistry.azurecr.io
      # Identify the source commit and make rerun tags distinct.
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to container registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        run: |
          IMAGE="$ACR_SERVER/automation-execution-api:$IMAGE_TAG"

          # The nested API folder is the Docker build context.
          docker build \
            --tag "$IMAGE" \
            --file AutomationExecution.API/Dockerfile \
            AutomationExecution.API

          docker push "$IMAGE"

          # Make the exact image reference available to later steps.
          echo "DEPLOYED_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy image to Azure
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name automation-execution-api \
            --image "$DEPLOYED_IMAGE" \
            --output none

      - name: Verify the new revision is ready
        run: |
          # Wait up to approximately five minutes for the new revision.
          for attempt in {1..30}; do
            APP=$(az containerapp show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --output json)

            LATEST=$(jq -r '.properties.latestRevisionName' <<< "$APP")
            READY=$(jq -r '.properties.latestReadyRevisionName' <<< "$APP")

            if [[ -n "$LATEST" && "$LATEST" != "null" && "$LATEST" == "$READY" ]]; then
              ACTUAL_IMAGE=$(az containerapp revision show \
                --name "$CONTAINER_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --revision "$READY" \
                --query "properties.template.containers[?name=='automation-execution-api'].image | [0]" \
                --output tsv)

              # Check the ready revision contains this run's image.
              if [[ "$ACTUAL_IMAGE" == "$DEPLOYED_IMAGE" ]]; then
                echo "Verified ready revision: $READY"
                exit 0
              fi
            fi

            echo "Waiting for the expected revision: attempt $attempt/30"
            sleep 10
          done

          echo "::error::The expected image did not become the latest ready revision."
          exit 1

      - name: Check the live API
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          # Retry to allow for startup and temporary routing delays.
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            "https://$FQDN/api/Executions" \
            --output response.json

          # The endpoint should return a JSON array.
          jq -e 'type == "array"' response.json > /dev/null

          echo "Live API check passed: https://$FQDN/api/Executions"